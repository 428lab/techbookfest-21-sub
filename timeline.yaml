  - id: bluesky-nostr
    title: Bluesky 構想と Nostr の誕生
    subtitle: Twitter の中から、Twitter の外から
    span: 2019年12月〜2022
    intro: ""
    comment: ""
    events:
      - date: "2019-12-11"
        tags: [bsky, central]
        title: Jack Dorsey が Bluesky を発表
        body: Twitter の CEO だった Jack Dorsey が、Twitter の資金で小さな独立チームを作り、分散型 SNS のオープンな標準を開発させると発表。
        comment: ""
        sources:
          - https://www.cnbc.com/2019/12/11/twitter-ceo-jack-dorsey-announces-bluesky-social-media-standards-push.html
      - date: "2020-11-07"
        tags: [nostr]
        title: fiatjaf が Nostr を公開
        body: ""
        comment: ""
        sources:
          - https://github.com/nostr-protocol/nostr/commits/master
      - date: "2021"
        date-note: 末
        tags: [bsky]
        title: Bluesky が独立した会社に
        body: Twitter から独立した会社（Bluesky PBLLC）として設立され、Twitter から初期資金1,300万ドルを得る。2022年2月に公表。
        comment: ""
        sources:
          - https://bsky.social/about/blog/2-7-2022-overview
      - date: "2022-10-27"
        tags: [central]
        title: Elon Musk が Twitter の買収を完了
        body: ""
        comment: ""
        sources:
          - https://en.wikipedia.org/wiki/Acquisition_of_Twitter_by_Elon_Musk
      - date: "2022-11"
        tags: [ap, central]
        title: Mastodon へ大量の移住
        body: 買収から11月7日までに約49万人が新たに登録し、Mastodon 全体の月間アクティブユーザーが100万人を超える。
        comment: ""
        sources:
          - https://fortune.com/2022/11/07/mastadon-struggles-large-number-twitter-defectors
      - date: "2022-12-15"
        tags: [nostr]
        title: Jack Dorsey が fiatjaf に14 BTC を寄付
        body: 約24万5千ドル相当。Dorsey は後に（2024年）、Nostr を「Bluesky でやりたかったことそのものだが、会社から生まれたものではない」と評した。
        comment: ""
        sources:
          - https://www.freethink.com/internet/nostr
          - https://reason.com/2024/08/13/can-nostr-make-twitters-dreams-come-true/

  - id: exodus
    title: Twitter の混乱
    subtitle: 移住先が分散した年
    span: 2023
    intro: ""
    comment: ""
    events:
      - date: "2023-01-12"
        tags: [central]
        title: Twitter がサードパーティクライアントを締め出す
        body: Tweetbot などのクライアントが突然使えなくなる。2月1日には API の無料提供を終えると発表する。
        comment: ""
        sources:
          - https://www.macrumors.com/2023/01/17/twitter-third-party-apps-intentionally-blocked/
          - https://techcrunch.com/2023/02/01/twitter-to-end-free-access-to-its-api/
      - date: "2023-02-01"
