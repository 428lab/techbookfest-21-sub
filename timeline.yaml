# 分散型SNS年表のデータ
#
# 書き方
#   date       : "2017-04-11" / "2017-04" / "2017" のどれか。月や日が不明なら省く
#   date-note  : 「中旬」「下旬」「末」など、日付に添える言葉(任意)
#   tags       : categories のキー。先頭のタグがその出来事の主な分類になる
#   title      : 1 行の見出し
#   body       : 事実の説明(任意)。調べた内容はここに書く
#   comment    : 著者(Shino3)が自分の言葉で差し込む欄。空なら何も出ない
#   unverified : true なら「要確認」の印が付く。出典を確かめたら消す
#   sources    : 出典の URL(任意)
#
# 時代(eras)にも intro と comment がある。intro はその時代の説明、comment は著者の所感

meta:
  title: 分散型SNS年表
  subtitle: 中央集権から分散へ、二十余年の流れ
  updated: "2026-11-14"

categories:
  central:
    label: 中央集権SNS
    short: CENTRAL
  ap:
    label: ActivityPub / Fediverse
    short: AP
  misskey:
    label: Misskey
    short: MISSKEY
  bsky:
    label: Bluesky / AT Protocol
    short: BLUESKY
  nostr:
    label: Nostr
    short: NOSTR
  japan:
    label: 日本での動き
    short: JP

eras:
  - id: prehistory
    title: 前史
    subtitle: 中央集権SNSの時代と、最初の分散の試み
    span: 2004〜2013
    intro: ""
    comment: ""
    events:
      - date: "2004-02-22"
        tags: [central, japan]
        title: mixi がサービスを開始
        body: 友人からの招待制の SNS として日本で普及する。
        comment: ""
        sources:
          - https://www.watch.impress.co.jp/docs/news/1573654.html
      - date: "2006-07-15"
        tags: [central]
        title: Twitter が一般公開
        body: 共同創業者の一人が Jack Dorsey。
        comment: ""
        sources:
          - https://www.britannica.com/money/Jack-Dorsey
      - date: "2008-04-23"
        tags: [central, japan]
        title: Twitter の日本語版が公開
        body: デジタルガレージと共同で日本語版を公開する。
        comment: ""
        sources:
          - https://internet.watch.impress.co.jp/cda/news/2008/04/23/19338.html
      - date: "2008-07-02"
        tags: [ap]
        title: identi.ca（Laconica、後の StatusNet）が公開
        body: 後の OStatus・GNU social につながる、分散型マイクロブログの先駆け。
        comment: ""
        sources:
          - https://en.wikipedia.org/wiki/Identi.ca
      - date: "2010-11-23"
        tags: [ap]
        title: Diaspora が公開
        body: 招待制のアルファ版が始まる。「Facebook の分散型の代替」として注目を集めた。
        comment: ""
        sources:
          - https://en.wikipedia.org/wiki/Diaspora_(social_network)
      - date: "2011"
        date-note: ごろ
        tags: [central, japan]
        title: mixi の利用が減っていく
        body: 「mixi 離れ」が言われ、利用者が Twitter・Facebook へ移っていく。
        comment: ""
        sources:
          - https://www.japantimes.co.jp/life/2011/12/21/digital/2011-the-year-when-japan-went-global-over-social-networking/

  - id: mastodon
    title: Mastodon の誕生
    subtitle: 日本のマストドンブーム
    span: 2014〜2017
    intro: ""
    comment: ""
    events:
      - date: "2014"
        tags: [misskey]
        title: syuilo が Misskey を公開
        body: 当時15歳の syuilo（しゅいろ）が公開。最初は掲示板型のサービスだった。
        comment: ""
        sources:
          - https://levtech.jp/media/article/interview/detail_268/
      - date: "2016-10-06"
        tags: [ap]
        title: Eugen Rochko が Mastodon を一般に発表
        body: ソースは同年3月に公開済み。当初は OStatus で連合していた。
        comment: ""
        sources:
          - https://blog.joinmastodon.org/2018/10/mastodons-2-year-anniversary/
      - date: "2017-04-11"
        tags: [ap, japan]
        title: mstdn.jp が始まる
        body: 4月15日にさくらのクラウドへ移ってデータを初期化し、再登録を受け付け、登録者数は同日夜に3万人を超える。4月16日には登録者数で世界1位になる。
        comment: ""
        sources:
          - https://mstdn.miraheze.org/wiki/Mstdn.jp
          - https://www.itmedia.co.jp/news/articles/1704/15/news020.html
      - date: "2017-04-17"
        tags: [ap, japan]
        title: pixiv の Pawoo が登録者数で世界1位に
        body: 4月19日には mstdn.jp が1位に戻る。8月には Twitter で絵描きのアカウントが相次いで凍結され、Pawoo へ移る人が増えた。
        comment: ""
        sources:
          - https://www.itmedia.co.jp/news/articles/1704/17/news115.html
          - https://www.itmedia.co.jp/news/articles/1708/28/news085.html
      - date: "2017-04-19"
        tags: [ap, japan]
        title: ドワンゴが friends.nico を公開
        body: 「お試し」として公開。niconico のアカウントと連携できた。mstdn.jp・Pawoo とともに国内の大手インスタンス（サーバー）として並び称された。
        comment: ""
        sources:
          - https://www.itmedia.co.jp/news/articles/1704/19/news136.html
          - https://gihyo.jp/lifestyle/serial/01/mastodon/0001
      - date: "2017-09-10"
        tags: [ap]
        title: Mastodon v1.6 が ActivityPub に対応
        body: ActivityPub を主なプロトコルにする。最初の実装ではないが、当時最大の実装だった。
        comment: ""
        sources:
          - https://activitypub.rocks/news/mastodon-ap-and-new-cr/
          - https://github.com/mastodon/mastodon/releases/tag/v1.6.0

