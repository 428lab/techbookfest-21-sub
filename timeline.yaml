        comment: ""
        sources:
          - https://bsky.social/about/blog/7-05-2023-business-plan
      - date: "2023-07"
        tags: [central]
        title: Meta が Threads を公開、Twitter は X に改称
        body: Threads は7月5日（米国時間）に公開。X への改称は7月23日に発表され、翌日ロゴが変わる。
        comment: ""
        sources:
