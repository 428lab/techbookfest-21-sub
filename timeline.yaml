        title: Damus が App Store で正式公開
        body: Twitter に似た UI と、Twitter の凍結騒動が重なり、日本で Nostr が急に流行る。
        comment: ""
        sources:
          - https://internet.watch.impress.co.jp/docs/yajiuma/1476399.html
          - https://note.com/tokuriki/n/ncd7c58687113
      - date: "2023-02-13"
        tags: [nostr]
        title: Zap（NIP-57）が始まる
        body: Lightning Network で投稿に少額の送金ができ、投稿者を直接支援できるようになる。
        comment: ""
        sources:
          - https://github.com/nostr-protocol/nips/pull/224
      - date: "2023-02-17"
        tags: [bsky]
        title: Bluesky が招待制の iOS ベータ版を公開
        body: ""
        comment: ""
        sources:
          - https://techcrunch.com/2023/02/28/jack-dorsey-backed-twitter-alternative-bluesky-hits-the-app-store-as-an-invite-only-app/
      - date: "2023-05-04"
        tags: [nostr]
        title: OpenSats に1,000万ドルの寄付
        body: "Jack Dorsey の #startsmall が非営利団体 OpenSats に寄付。うち500万ドルが Nostr の開発支援にあてられる。"
        comment: ""
        sources:
          - https://opensats.org/blog/opensats-receives-additional-funding-of-dollar10m-from-startsmall
      - date: "2023-07-02"
        tags: [central, misskey, japan]
        title: Twitter が閲覧数を制限、Misskey.io に登録が殺到
        body: Twitter が1日に閲覧できる投稿数を制限。Misskey.io の登録者数が2月の約3万人から20万人超に急増し、新規登録を支援者優先に絞る。
        comment: ""
