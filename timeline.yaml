# 年表の最後に添える「支えている人たち」。誰がそのプロダクトを支えているか
#   supporters : 支えている人・組織をひとことで
#   how        : どう支えているか
#   sources    : 出典の URL(脚注に出る)
funding:
  intro: ""
  comment: ""
  rows:
    - protocol: Mastodon
      tags: [ap]
      supporters: 非営利の運営団体と寄付する人たち
      how: 開発は非営利の運営団体が担う。Patreon などの小口の寄付、篤志家の大口の寄付、企業のスポンサーで成り立つ。各サーバーはそれぞれの運営者が支える。
      sources:
        - https://joinmastodon.org/sponsors
        - https://blog.joinmastodon.org/2025/01/the-people-should-own-the-town-square/
    - protocol: Misskey
      tags: [misskey]
      supporters: 有志の開発者と寄付する人たち、サーバーの運営会社
      how: 本体は syuilo と有志が開発し、FANBOX・Patreon・GitHub Sponsors の寄付で支えられる。最大のサーバー Misskey.io は株式会社MisskeyHQ が運営し、利用者の月額の支援やスポンサーで成り立つ。
      sources:
        - https://misskey-hub.net/ja/docs/donate/
        - https://prtimes.jp/main/html/rd/p/000000018.000039709.html
    - protocol: Bluesky
      tags: [bsky]
      supporters: 公益を掲げる会社と、出資するベンチャーキャピタル
      how: Bluesky Social PBC が開発と主なサーバーを担う。Twitter からの1,300万ドルで始まり、その後は Neo、Blockchain Capital、Bain Capital Crypto などが出資している。
      sources:
        - https://bsky.social/about/blog/7-05-2023-business-plan
        - https://bsky.social/about/blog/10-24-2024-series-a
        - https://bsky.social/about/blog/03-19-2026-series-b
    - protocol: Nostr
      tags: [nostr]
      supporters: 個人の開発者と寄付する人たち、利用者どうし
      how: Nostr 自体に運営会社や財団はなく、仕様は GitHub で話し合って決める。開発支援には、Jack Dorsey 本人の寄付、OpenSats の Nostr 基金、Nostr を中心に複数のオープンなプロトコルを支える and Other Stuff への提供、HRF の助成がある。利用者は Zap で投稿者や開発者を直接支える。
      sources:
        - https://opensats.org/blog/opensats-receives-additional-funding-of-dollar21m-from-startsmall
        - https://hrf.org/program/financial-freedom/bitcoin-development-fund/
